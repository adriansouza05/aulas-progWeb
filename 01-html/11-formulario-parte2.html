<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="09-tabelaSemantica.html" method="GET">
        <p>
            Veículos<br>
            <input type="checkbox" name="chkVeiculo" value="City">City
            <input type="checkbox" name="chkVeiculo" value="Gol">Gol
            <input type="checkbox" name="chkVeiculo" value="Corsa">Corsa
        </p>
            
        <p>
            Motos<br>
            <input type="checkbox" name="chkMoto" value="Kawasaki">Kawasaki
            <input type="checkbox" name="chkMoto" value="Honda">Honda
            <input type="checkbox" name="chkMoto" value="Xinerai">Xinerai
        </p>

        <p>
            Dias da Semana<br>
            <input type="radio" name="rbdDia" value="1" checked>Segunda-Feira
            <input type="radio" name="rbdDia" value="3">Quarta-Feira
            <input type="radio" name="rbdDia" value="5">Sexta-Feira
        </p>

        <p>
            Final de Semana<br>
            <input type="radio" name="rbdFimSemana" value="1">Sábado
            <input type="radio" name="rbdFimSemana" value="2" checked>Domingo
        </p>

        <p>
            <select name="cboPaises" id="">
                <option value="AG">Argentina</option>
                <option value="BL">Bolívia</option>
                <option value="BR">Brasil</option>
                <option value="CH">Chile</option>
            </select>
        </p>

        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>
</body>
</html>
