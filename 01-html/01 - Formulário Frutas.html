<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Frutas</h1>
    <form action="" method="get">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <form action="">
                <p>
                    Nome <input type="text" name="txtNome" value=""><br>
                    Endereço <input type="text" name="txtEndereco" value=""><br>
                    Nome <input type="text" name="txtNome" value=""><br>
                </p>

            </form>
        </fieldset>

        <br>

        <fieldset>
            <legend>Dados de Consumo</legend>
            <form action="">
                <p>
                    Quantas porções de fruta você consome por dia?<br>
                    <input type="radio" name="rbd" value="">0
                    <input type="radio" name="rbd" value="">1
                    <input type="radio" name="rbd" value="">2
                    <input type="radio" name="rbd" value="">Mais que duas
                </p>

                <p>
                    Quais são suas frutas preferidas?<br>
                    <select name="cbofrutas" id="" size="5">
                        <option value="MAÇA">Maça</option>
                        <option value="BANANA">Banana</option>
                        <option value="MAMÃO">Mamão</option>
                        <option value="LARANJA">Laranja</option>
                        <option value="MELANCIA">Melancia</option>
                    </select>
                </p>

                <p>
                    Gostaria de receber promoções
                    <input type="checkbox" name="chkSim" value="">Sim
                </p>

                <p>
                    <input type="submit" value="Enviar">
                    <input type="submit" value="Apagar">
                </p>

            </form>
        </fieldset>
    </form>
</body>

</html>
